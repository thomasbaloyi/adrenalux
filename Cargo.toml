[workspace]
members = [
    "crates/adrenalux-core",
    "crates/adrenalux-daemon",
    "crates/adrenalux-ctl",
    "crates/adrenalux-layer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Thomas Baloyi <60699879+thomasbaloyi@users.noreply.github.com>"]
license = "GPL-3.0"
repository = "https://github.com/thomasbaloyi/adrenalux"

[workspace.dependencies]
adrenalux-core = { path = "crates/adrenalux-core" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
evdev = "0.12"
nix = { version = "0.29", features = ["signal", "process"] }
libc = "0.2"
